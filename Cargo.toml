[package]
name = "cce-documents"
version = "0.1.0"
edition = "2021"

[dependencies]
# doc_editor: the Markdown being edited lives in DocEditor's buffer (lines,
# caret, selection, undo).
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "ec907daa331c6d8b6eaeba5b0ee8ea678a67043a", features = ["doc_editor"] }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
# Decodes the PNG pages pdftoppm writes, and the PNG and JPEG pictures a
# Markdown document shows while it is edited.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
env_logger = "0.11"
# PDFium, loaded at runtime from ~/.local/lib (scripts/fetch-pdfium), and
# driven through its C API (see src/engine.rs); pdfium-render supplies the
# loader, function table and types. The API version is pinned to the newest
# pdfium-render knows; the fetched build may be newer, which PDFium's stable
# C API allows.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
# Trims PDFium's incremental updates to the objects that changed (src/trim.rs).
lopdf = { version = "0.45.0", default-features = false }
# The writing engine: Markdown in, PDF out. pulldown-cmark parses (parser
# only), krilla writes the pages from cosmic-text's shaped glyphs (its own
# shaping is not needed; raster-images embeds PNG and JPEG pictures), kdl
# reads styles.
pulldown-cmark = { version = "0.13.4", default-features = false }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
kdl = "6.7.1"
# Printing goes through the desktop's Print portal (cce-desktop-portal), with
# the same ashpd build and blocking executor rfd already brings in for
# cce-ui's file dialogs.
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
pollster = "0.4.0"
